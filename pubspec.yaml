name: za2zo2a_admin
description: "Za2zo2a operator console — Flutter Web admin panel."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management — matches the mobile app (Cubit/BLoC).
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Routing — matches the mobile app.
  go_router: ^14.6.2

  # Networking — matches the mobile app.
  dio: ^5.7.0

  # DI — matches the mobile app.
  get_it: ^8.0.2

  # Token storage — matches the mobile app.
  flutter_secure_storage: ^9.2.2

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Typography from the design. Bundled rather than pulled from Google's CDN at
  # runtime (which is what the google_fonts package does): the console then has
  # no third-party font request, no flash of unstyled text, and works offline.
  fonts:
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
